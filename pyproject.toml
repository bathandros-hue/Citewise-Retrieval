[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citewise-retrieval"
version = "0.1.0"
description = "Local hybrid retrieval with transparent ranking and exact source offsets"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
citewise = "citewise.cli:main"

[tool.setuptools.packages.find]
include = ["citewise*"]
